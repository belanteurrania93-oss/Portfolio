<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=s, initial-scale=1.0">
    
    <title>Portfolio of The Great</title>
    <link rel="shortcut icon" href="Images/5de9f-illustrator_cs2_icon_by_wachu.png">
    <link rel="stylesheet" href="fhs.css">
   
</head">

<body>
    <div id="carouselExampleCaptions" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
          <li data-target="#carouselExampleCaptions" data-slide-to="0" class="active"></li>
          <li data-target="#carouselExampleCaptions" data-slide-to="1"></li>
          <li data-target="#carouselExampleCaptions" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="./images/White.dwarf.png" class="d-block w-100" alt="...">
            <div class="carousel-caption d-none d-md-block">
              <h5>WHITE DWARF</h5>
              <p> stellar core remnant composed mostly of electron-degenerate matter.</p>
            </div>
          </div>
          <div class="carousel-item">
            <img src="./images/Wolf-Rayet stars.png" class="d-block w-100" alt="...">
            <div class="carousel-caption d-none d-md-block">
              <h5>WOLF-RAYET STAR</h5>
              <p> Wolf–Rayet stars are evolved, massive stars.</p>
            </div>
          </div>
          <div class="carousel-item">
            <img src="./images/neutron stars.png" class="d-block w-100" alt="...">
            <div class="carousel-caption d-none d-md-block">
              <h5>NEUTRON STAR</h5>
              <p>It is the collapsed core of a massive supergiant star.</p>
            </div>
          </div>
        </div>
        <a class="carousel-control-prev" href="#carouselExampleCaptions" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleCaptions" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>   

</body>
</html>
